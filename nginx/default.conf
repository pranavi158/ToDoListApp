server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # The /api/ block was removed because ALB handles /api/ routing directly on AWS.

}
