version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  autoscaler:
    build:
      context: .
      dockerfile: autoscaler/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SERVICE_NAME=backend
      - MIN_REPLICAS=1
      - MAX_REPLICAS=5
      - CPU_THRESHOLD=70
    restart: unless-stopped

volumes:
  redis_data:
